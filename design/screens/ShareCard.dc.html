<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share image</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1200px; height: 630px; box-sizing: border-box; padding: 64px; display: flex; gap: 56px; background: #f6f7f5; color: #1b211f; font-family: 'Atkinson Hyperlegible Next', 'Noto Sans', system-ui, sans-serif;">
  <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: space-between;">
    <span style="font-size: 28px; line-height: 36px; font-weight: 700;">Find My AI Worldview</span>
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <span style="font-size: 28px; line-height: 36px; color: #545e5a;">My closest perspective</span>
      <span style="font-size: 96px; line-height: 104px; font-weight: 700;">Stewards</span>
      <span style="font-size: 34px; line-height: 44px;">Build it, with rules that have teeth.</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <span style="font-size: 28px; line-height: 36px; font-weight: 700;">What do you think about AI?</span>
      <span style="font-size: 24px; line-height: 32px; color: #2c6b64;">findmyaiworldview.maplesparklabs.com</span>
    </div>
  </div>
  <div style="flex: none; width: 460px; box-sizing: border-box; padding: 32px; border-radius: 12px; background: #e2eeeb; display: flex; flex-direction: column; justify-content: space-between;">
    <sc-for list="{{ tracks }}" as="t" hint-placeholder-count="6">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="position: relative; height: 20px;">
          <div style="position: absolute; left: 0; right: 0; top: 8px; height: 4px; border-radius: 999px; background: #ffffff;"></div>
          <div style="{{ t.marker }}"></div>
        </div>
        <div style="display: flex; justify-content: space-between; gap: 16px; font-size: 20px; line-height: 26px; color: #545e5a;"><span>{{ t.low }}</span><span>{{ t.high }}</span></div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":630}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      ['Little good', 'A lot of good', 1.2],
      ['Little harm', 'Serious harm', 0.8],
      ['Move faster', 'Slow down', 0.2],
      ['Industry rules', 'Public rules', 2.2],
      ['AI can decide', 'Humans decide', 1.0],
      ['Markets share gains', 'Share deliberately', 0.4]
    ];
    return {
      tracks: rows.map(([low, high, s]) => ({
        low, high,
        marker: 'position: absolute; top: 0; left: ' + ((s + 3) / 6 * 100).toFixed(1) + '%; width: 20px; height: 20px; margin-left: -10px; border-radius: 999px; background: #2c6b64;'
      }))
    };
  }
}
</script>
</body>
</html>
