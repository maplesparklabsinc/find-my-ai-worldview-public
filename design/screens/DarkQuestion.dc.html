<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dark mode: question</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; padding: 4px clamp(16px, 4vw, 24px) 16px; display: flex; flex-direction: column; background: #141816; color: #eef1ef; font-family: 'Atkinson Hyperlegible Next', 'Noto Sans', system-ui, sans-serif; font-size: 19px; line-height: 28px;">
  <div style="width: 100%; max-width: 640px; margin: 0 auto; flex: 1 0 auto; display: flex; flex-direction: column; gap: 16px;">

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <header style="display: flex; align-items: center; gap: 4px; min-height: 48px;">
        <sc-if value="{{ canGoBack }}" hint-placeholder-val="{{ true }}">
          <button type="button" aria-label="Back" onClick="{{ back }}" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; margin-left: -14px; padding: 0; border: 0; border-radius: 12px; background: transparent; color: #eef1ef; cursor: pointer;">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>
          </button>
        </sc-if>
        <sc-if value="{{ atFirst }}" hint-placeholder-val="{{ false }}">
          <a href="#" aria-label="Back" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; margin-left: -14px; color: #eef1ef;">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>
          </a>
        </sc-if>
        <span style="flex: 1 1 auto; font-size: 16px; line-height: 24px; color: #a9b2ae;">Question {{ number }} of 50</span>
        <button type="button" aria-label="Larger text" aria-pressed="{{ largerPressed }}" onClick="{{ toggleSize }}" style="{{ sizeButtonStyle }}">Aa</button>
        <a href="#" style="display: flex; align-items: center; min-height: 48px; padding: 0 0 0 12px; color: #a9b2ae; font-size: 17px; line-height: 24px;">Skip</a>
      </header>
      <div role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="50" aria-valuenow="{{ number }}" style="height: 6px; border-radius: 999px; background: #353d3a; overflow: hidden;">
        <div style="{{ barStyle }}"></div>
      </div>
    </div>

    <p style="{{ statementStyle }}">{{ statement }}</p>

    <div style="display: flex; flex-direction: column; gap: 6px;" role="group" aria-label="Your answer">
      <sc-for list="{{ options }}" as="opt" hint-placeholder-count="7">
        <button type="button" aria-pressed="{{ opt.pressed }}" onClick="{{ opt.pick }}" style="{{ opt.style }}">
          <span>{{ opt.label }}</span>
          <sc-if value="{{ opt.on }}" hint-placeholder-val="{{ false }}">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#7fc4ba" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><path d="M4.5 10.5 8 14l7.5-8"/></svg>
          </sc-if>
        </button>
      </sc-for>
    </div>

    <sc-if value="{{ showContinue }}" hint-placeholder-val="{{ false }}">
      <a href="#" style="display: flex; align-items: center; justify-content: center; width: 100%; min-height: 56px; border-radius: 12px; background: #7fc4ba; color: #0f1a18; font-size: 19px; font-weight: 600; text-decoration: none;">Continue</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"order":{"editor":"enum","options":["Disagree first","Agree first"],"default":"Disagree first"},"$preview":{"width":390,"height":664}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 1, answers: { 0: 4, 1: 5 }, larger: false };
  }
  componentWillUnmount() { clearTimeout(this.timer); }
  renderVals() {
    const statements = [
      'When AI influences an important decision about a person, such as a loan, a job or a medical treatment, that person should be able to appeal to a human.',
      'Some decisions should always be made by a human, even if an AI would make them more accurately.',
      'I would rather have a human explain a decision I disagree with than an AI that gets it right more often.'
    ];
    const labels = ['Strongly disagree', 'Disagree', 'Somewhat disagree', 'Neither agree nor disagree', 'Somewhat agree', 'Agree', 'Strongly agree'];
    const agreeFirst = (this.props.order ?? 'Disagree first') === 'Agree first';
    const shown = agreeFirst ? labels.map((l, k) => [l, k]).reverse() : labels.map((l, k) => [l, k]);
    const { i, answers, larger } = this.state;
    const number = 26 + i;
    const picked = answers[i];
    const pick = (k) => () => {
      this.setState({ answers: Object.assign({}, answers, { [i]: k }) });
      clearTimeout(this.timer);
      if (i < statements.length - 1) this.timer = setTimeout(() => this.setState({ i: i + 1 }), 400);
    };
    const statementSize = larger ? 'font-size: clamp(26px, 1.2vw + 21.5px, 32px); line-height: 1.3;' : 'font-size: clamp(22px, 1.2vw + 17.5px, 28px); line-height: 1.32;';
    const base = {
      number,
      statement: statements[i],
      statementStyle: 'margin: 0; font-weight: 600; ' + statementSize,
      barStyle: 'width: ' + (number / 50 * 100).toFixed(1) + '%; height: 6px; border-radius: 999px; background: #7fc4ba;',
      canGoBack: i > 0,
      atFirst: i === 0,
      back: () => { clearTimeout(this.timer); this.setState({ i: Math.max(0, i - 1) }); },
      largerPressed: larger ? 'true' : 'false',
      toggleSize: () => this.setState({ larger: !larger }),
      sizeButtonStyle: 'display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; flex: none; padding: 0; border-radius: 12px; font-family: inherit; font-size: 19px; font-weight: 700; color: #eef1ef; cursor: pointer; ' + (larger ? 'background: #1f3330; border: 2px solid #7fc4ba;' : 'background: transparent; border: 1px solid transparent;'),
      showContinue: i === statements.length - 1 && picked !== undefined
    };
    const optSize = larger ? 'font-size: 22px; line-height: 28px;' : 'font-size: 19px; line-height: 24px;';
    const row = 'display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 48px; box-sizing: border-box; border-radius: 12px; font-family: inherit; text-align: left; color: #eef1ef; cursor: pointer; ' + optSize;
    const on = row + ' padding: 9px 13px; background: #1f3330; border: 2px solid #7fc4ba; font-weight: 700;';
    const off = row + ' padding: 10px 14px; background: #1c2120; border: 1px solid #6f7975; font-weight: 500;';
    return Object.assign(base, {
      options: shown.map(([label, k]) => ({
        label, on: picked === k, pressed: picked === k ? 'true' : 'false',
        style: picked === k ? on : off, pick: pick(k)
      }))
    });
  }
}
</script>
</body>
</html>
