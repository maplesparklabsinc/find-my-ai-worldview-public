<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agree or disagree question, horizontal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; padding: 4px clamp(16px, 4vw, 24px) 16px; display: flex; flex-direction: column; background: #f6f7f5; color: #1b211f; font-family: 'Atkinson Hyperlegible Next', 'Noto Sans', system-ui, sans-serif; font-size: 19px; line-height: 28px;">
  <div style="width: 100%; max-width: 640px; margin: 0 auto; flex: 1 0 auto; display: flex; flex-direction: column; gap: 16px;">

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <header style="display: flex; align-items: center; gap: 4px; min-height: 48px;">
        <sc-if value="{{ canGoBack }}" hint-placeholder-val="{{ true }}">
          <button type="button" aria-label="Back" onClick="{{ back }}" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; margin-left: -14px; padding: 0; border: 0; border-radius: 12px; background: transparent; color: #1b211f; cursor: pointer;">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>
          </button>
        </sc-if>
        <sc-if value="{{ atFirst }}" hint-placeholder-val="{{ false }}">
          <a href="Start.dc.html" aria-label="Back" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; margin-left: -14px; color: #1b211f;">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>
          </a>
        </sc-if>
        <span style="flex: 1 1 auto; font-size: 16px; line-height: 24px; color: #545e5a;">Question {{ number }} of 50</span>
        <button type="button" aria-label="Larger text" aria-pressed="{{ largerPressed }}" onClick="{{ toggleSize }}" style="{{ sizeButtonStyle }}">Aa</button>
        <a href="Tradeoff.dc.html" style="display: flex; align-items: center; min-height: 48px; padding: 0 0 0 12px; color: #545e5a; font-size: 17px; line-height: 24px;">Skip</a>
      </header>
      <div role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="50" aria-valuenow="{{ number }}" style="height: 6px; border-radius: 999px; background: #d5dbd8; overflow: hidden;">
        <div style="{{ barStyle }}"></div>
      </div>
    </div>

    <p style="{{ statementStyle }}">{{ statement }}</p>

    <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 8px;">
      <div style="display: flex; gap: 4px;" role="radiogroup" aria-label="Your answer">
        <sc-for list="{{ options }}" as="opt" hint-placeholder-count="7">
          <button type="button" role="radio" aria-checked="{{ opt.pressed }}" aria-label="{{ opt.label }}" onClick="{{ opt.pick }}" style="{{ opt.style }}">
            <span style="{{ opt.dot }}"></span>
          </button>
        </sc-for>
      </div>
      <div style="position: relative; height: 48px; font-size: 16px; line-height: 22px; color: #545e5a;" aria-hidden="true">
        <span style="position: absolute; left: 0; top: 0; width: 30%;">{{ leftLabel }}</span>
        <span style="position: absolute; left: 35%; width: 30%; top: 0; text-align: center;">Neither</span>
        <span style="position: absolute; right: 0; top: 0; width: 30%; text-align: right;">{{ rightLabel }}</span>
      </div>
      <p style="{{ pickedStyle }}" aria-live="polite">{{ pickedText }}</p>
    </div>

    <sc-if value="{{ showContinue }}" hint-placeholder-val="{{ false }}">
      <a href="Tradeoff.dc.html" style="display: flex; align-items: center; justify-content: center; width: 100%; min-height: 56px; border-radius: 12px; background: #2c6b64; color: #ffffff; font-size: 19px; font-weight: 600; text-decoration: none;">Continue</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"order":{"editor":"enum","options":["Disagree first","Agree first"],"default":"Disagree first"},"$preview":{"width":390,"height":664}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 1, answers: { 0: 4, 1: 5 }, larger: false };
  }
  componentWillUnmount() { clearTimeout(this.timer); }
  renderVals() {
    const statements = [
      'When AI influences an important decision about a person, such as a loan, a job or a medical treatment, that person should be able to appeal to a human.',
      'Some decisions should always be made by a human, even if an AI would make them more accurately.',
      'I would rather have a human explain a decision I disagree with than an AI that gets it right more often.'
    ];
    const labels = ['Strongly disagree', 'Disagree', 'Somewhat disagree', 'Neither agree nor disagree', 'Somewhat agree', 'Agree', 'Strongly agree'];
    const agreeFirst = (this.props.order ?? 'Disagree first') === 'Agree first';
    const shown = agreeFirst ? labels.map((l, k) => [l, k]).reverse() : labels.map((l, k) => [l, k]);
    const { i, answers, larger } = this.state;
    const number = 26 + i;
    const picked = answers[i];
    const pick = (k) => () => {
      this.setState({ answers: Object.assign({}, answers, { [i]: k }) });
      clearTimeout(this.timer);
      if (i < statements.length - 1) this.timer = setTimeout(() => this.setState({ i: i + 1 }), 400);
    };
    const statementSize = larger ? 'font-size: clamp(26px, 1.2vw + 21.5px, 32px); line-height: 1.3;' : 'font-size: clamp(24px, 1.2vw + 19.5px, 28px); line-height: 1.33;';
    const base = {
      number,
      statement: statements[i],
      statementStyle: 'margin: 0; font-weight: 600; ' + statementSize,
      barStyle: 'width: ' + (number / 50 * 100).toFixed(1) + '%; height: 6px; border-radius: 999px; background: #2c6b64;',
      canGoBack: i > 0,
      atFirst: i === 0,
      back: () => { clearTimeout(this.timer); this.setState({ i: Math.max(0, i - 1) }); },
      largerPressed: larger ? 'true' : 'false',
      toggleSize: () => this.setState({ larger: !larger }),
      sizeButtonStyle: 'display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; flex: none; padding: 0; border-radius: 12px; font-family: inherit; font-size: 19px; font-weight: 700; color: #1b211f; cursor: pointer; ' + (larger ? 'background: #e2eeeb; border: 2px solid #2c6b64;' : 'background: transparent; border: 1px solid transparent;'),
      showContinue: i === statements.length - 1 && picked !== undefined
    };
    const cell = 'flex: 1 1 0; min-width: 0; height: 56px; display: flex; align-items: center; justify-content: center; padding: 0; box-sizing: border-box; border-radius: 12px; cursor: pointer;';
    const dot = 'display: block; width: 22px; height: 22px; box-sizing: border-box; border-radius: 999px;';
    const ends = agreeFirst ? ['Strongly agree', 'Strongly disagree'] : ['Strongly disagree', 'Strongly agree'];
    return Object.assign(base, {
      leftLabel: ends[0],
      rightLabel: ends[1],
      pickedText: picked === undefined ? 'Tap the point closest to your view.' : labels[picked],
      pickedStyle: 'margin: 0; min-height: 28px; ' + (picked === undefined ? 'color: #545e5a; font-weight: 400;' : 'color: #1b211f; font-weight: 700;'),
      options: shown.map(([label, k]) => ({
        label, pressed: picked === k ? 'true' : 'false', pick: pick(k),
        style: cell + (picked === k ? ' background: #e2eeeb; border: 2px solid #2c6b64;' : ' background: #ffffff; border: 1px solid #7f8985;'),
        dot: dot + (picked === k ? ' background: #2c6b64; border: 0;' : ' background: #ffffff; border: 2px solid #7f8985;')
      }))
    });
  }
}
</script>
</body>
</html>
