# Local Postgres for development and database tests (issue #53).
#
#   npm run db:up      start it and run the migrations on both databases
#   npm run db:down    stop it (the data stays in the fmaw-pg volume)
#
# The user name and password below are for this local database only. They're
# fine to commit: it listens on 127.0.0.1 only, so nothing outside this
# computer can reach it, and it only ever holds made-up seed data and test runs.
#
# Postgres 17, the newest major version Supabase runs.
services:
  db:
    image: postgres:17
    ports:
      - "127.0.0.1:54329:5432"
    environment:
      POSTGRES_USER: fmaw
      POSTGRES_PASSWORD: local
      POSTGRES_DB: postgres
    volumes:
      - fmaw-pg:/var/lib/postgresql/data
      - ./db/local:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fmaw -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  fmaw-pg:
